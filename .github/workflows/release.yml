name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOEXPERIMENT: jsonv2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            build-essential \
            jq \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails v3
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run wails doctor
        run: wails3 doctor

      - name: Build Windows
        run: |
          go mod tidy
          wails3 task build:windows:prod

      - name: Build Linux
        run: |
          wails3 task build:linux

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.info."0000".ProductVersion' build/info.json)
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Archive Windows
        run: |
          cd .bin
          zip kubegui-windows-x86_64.zip kubegui.exe

      - name: Archive Linux
        run: |
          cd .bin
          zip kubegui-linux-amd64.zip kubegui

      - name: Upload release archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: .bin/*.zip
          if-no-files-found: error
          include-hidden-files: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-archives
          path: .bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          generate_release_notes: false
          files: |
            ${{ github.workspace }}/.bin/*.zip
